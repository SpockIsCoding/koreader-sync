name = "koreader-sync"
main = "src/index.ts"
compatibility_date = "2026-03-25"

[placement]
mode = "smart"

[vars]
SESSION_TTL_HOURS = "168"

[[d1_databases]]
binding = "DB"
database_name = "koreader-sync-db"
database_id = "9ba23313-abb4-4f2b-ad03-5f7f31018a38"
migrations_dir = "migrations"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
